<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="100%">
  <defs>
    <style>
      .bold-title { font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Impact', 'Arial Black', sans-serif; font-weight: 900; font-style: italic; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .jp { font-family: -apple-system, 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', sans-serif; }
    </style>
    <pattern id="diagStripes" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="0.8" opacity="0.04" />
    </pattern>
  </defs>
  <rect width="880" height="130" rx="8" fill="#090a10" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  <rect width="880" height="130" rx="8" fill="url(#diagStripes)" />
  <polygon points="24,16 195,16 183,36 24,36" fill="#ff2a85" />
  <text x="36" y="30" fill="#ffffff" font-size="11" class="mono" font-weight="900" letter-spacing="3.5">TRANSMISSION</text>
  <text x="790" y="30" fill="#64748b" font-size="12" class="jp" font-weight="700" letter-spacing="4">交 信 中</text>
  <g transform="translate(24, 45)">
    <polygon points="0,0 230,0 216,68 0,68" fill="#f8fafc" />
    <text x="24" y="49" fill="#090a10" font-size="42" class="bold-title" letter-spacing="2">DISCORD</text>
  </g>
  <g transform="translate(280, 68)">
    <circle cx="6" cy="-4" r="5" fill="#ff2a85" />
    <text x="24" y="2" fill="#f8fafc" font-size="24" class="mono" font-weight="700">@<tspan fill="#ff2a85">ponchikkk</tspan></text>
    <text x="24" y="24" fill="#64748b" font-size="11" class="mono" letter-spacing="3">SAY SOMETHING</text>
  </g>
  <polygon points="880,65 880,130 780,130" fill="#ff2a85" />
  <polygon points="880,95 880,130 830,130" fill="#38bdf8" opacity="0.6" />
</svg>
