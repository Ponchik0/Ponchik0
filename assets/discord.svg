<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <linearGradient id="animeDiscBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="60%" stop-color="#0e1428" />
      <stop offset="100%" stop-color="#140d21" />
    </linearGradient>
    <pattern id="diagLinesAnime" x="0" y="0" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#38bdf8" stroke-width="0.8" opacity="0.06" />
    </pattern>
    <style>
      .bold-impact { font-family: 'Impact', 'Montserrat', 'Arial Black', sans-serif; font-style: italic; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
      .jp-font { font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', sans-serif; }
    </style>
  </defs>

  <rect width="900" height="130" rx="10" fill="url(#animeDiscBg)" stroke="#ff2a85" stroke-opacity="0.4" stroke-width="1.5" />
  <rect width="900" height="130" rx="10" fill="url(#diagLinesAnime)" />
  <rect x="0" y="0" width="8" height="130" rx="4" fill="#ff2a85" />

  <!-- DISCORD White Block -->
  <g transform="translate(24, 28)">
    <polygon points="0,0 230,0 216,74 0,74" fill="#ffffff" />
    <text x="24" y="52" fill="#080b14" font-size="44" class="bold-impact" letter-spacing="2">DISCORD</text>
  </g>

  <!-- Big Username & Subtitle -->
  <g transform="translate(275, 48)">
    <circle cx="8" cy="18" r="7" fill="#ff2a85" />
    <text x="30" y="28" fill="#ffffff" font-size="34" class="mono" font-weight="900" letter-spacing="1">@<tspan fill="#ff2a85">ponchikkk</tspan></text>
    <text x="32" y="54" fill="#38bdf8" font-size="13" class="mono" font-weight="700" letter-spacing="2">ADD ME • OPEN FOR CHAT &amp; COLLABORATION</text>
  </g>

  <polygon points="900,45 900,130 780,130" fill="#ff2a85" />
  <polygon points="900,85 900,130 830,130" fill="#38bdf8" />
  <text x="805" y="32" fill="#ffffff" font-size="13" class="jp-font" font-weight="900" letter-spacing="3" opacity="0.8">交 信 中</text>
</svg>
