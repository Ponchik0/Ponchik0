<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <style>
      .bold-title { font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Impact', 'Arial Black', sans-serif; font-weight: 900; font-style: italic; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .jp { font-family: -apple-system, 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', sans-serif; }
    </style>
    <pattern id="speedRays" width="880" height="240" patternUnits="userSpaceOnUse">
      <path d="M 0,240 L 40,-50 M 0,240 L 110,-50 M 0,240 L 190,-50 M 0,240 L 290,-50 M 0,240 L 410,-50 M 0,240 L 550,-50 M 0,240 L 710,-50 M 0,240 L 890,-30 M 0,240 L 950,50 M 0,240 L 950,140 M 0,240 L 950,210" stroke="#ffffff" stroke-width="1.2" opacity="0.08" />
    </pattern>
    <pattern id="pinkDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.3" fill="#ff2a85" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="880" height="240" rx="8" fill="#090a10" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  <rect width="880" height="240" rx="8" fill="url(#speedRays)" />
  <rect x="15" y="180" width="220" height="45" fill="url(#pinkDots)" rx="4" />
  <polygon points="560,0 640,0 520,85 440,85" fill="#ff2a85" />
  <polygon points="660,0 720,0 610,75 550,75" fill="#38bdf8" opacity="0.4" />
  <g transform="translate(28, 30)">
    <polygon points="0,0 6,6 0,12 -6,6" fill="#ff2a85" />
    <text x="16" y="9" fill="#9ca3af" font-size="11" class="mono" letter-spacing="2.5" font-weight="700">第 01 話 / CH. 01</text>
  </g>
  <text x="50" y="146" fill="#2563eb" font-size="96" class="bold-title" letter-spacing="3" opacity="0.5">PONCHIK</text>
  <text x="46" y="142" fill="#ff2a85" font-size="96" class="bold-title" letter-spacing="3">PONCHIK</text>
  <text x="40" y="136" fill="#f8fafc" font-size="96" class="bold-title" letter-spacing="3">PONCHIK</text>
  <g transform="translate(42, 165)">
    <rect width="215" height="34" rx="4" fill="#ffffff" />
    <text x="14" y="23" fill="#090a10" font-size="15" class="jp" font-weight="900" letter-spacing="2">「 ただ、つくる。」</text>
    <text x="230" y="22" fill="#64748b" font-size="12" class="mono" letter-spacing="2">just make things.</text>
  </g>
  <g transform="translate(810, 42)" opacity="0.7">
    <text x="0" y="0" fill="#f8fafc" font-size="20" class="jp" font-weight="900">ポ</text>
    <text x="0" y="32" fill="#f8fafc" font-size="20" class="jp" font-weight="900">ン</text>
    <text x="0" y="64" fill="#f8fafc" font-size="20" class="jp" font-weight="900">チ</text>
    <text x="0" y="96" fill="#f8fafc" font-size="20" class="jp" font-weight="900">ク</text>
  </g>
</svg>
