name: Generate Snake Animation

on:
  schedule:
    # Запуск каждый день в полночь UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ponchik0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#b24a78&color_dots=#eee9ed,#e2cdd8,#d5adbf,#c17e9d,#a14b74
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#edb3cc&color_dots=#211c21,#4d303f,#7c4862,#b66e92,#edb3cc

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
